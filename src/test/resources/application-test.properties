app.integration.api.sisaudcon.url=http://localhost:8081
app.integration.api.sisaudcon.request-header-key=X-API-KEY
app.integration.api.sisaudcon.request-header-value=test-key
app.integration.api.webservicesaam.url=http://localhost:8082
